<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>越心平台 — 專案設定</title>
    <style>
        body {
            font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
            max-width: 600px;
            margin: 60px auto;
            padding: 0 20px;
            background: #FFFDEB;
            color: #333;
        }
        h1 {
            color: #CE2626;
            margin-bottom: 30px;
        }
        .item {
            margin-bottom: 16px;
            line-height: 1.6;
        }
        .label {
            font-weight: bold;
            color: #7DAACB;
        }
        .colors {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .swatch {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 6px;
            font-size: 12px;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>
    <h1>越心平台網頁專案</h1>
    <div class="item"><span class="label">任務：</span>開發越南房產服務相關的網頁</div>
    <div class="item"><span class="label">風格：</span>參考 golavisa 設計</div>
    <div class="item"><span class="label">產出：</span>可直接用瀏覽器開啟的 HTML/CSS 檔案</div>
    <div class="item"><span class="label">配色：</span></div>
    <div class="colors">
        <div class="swatch" style="background:#7DAACB;">天空藍<br>#7DAACB</div>
        <div class="swatch" style="background:#E8DBB3; color:#555; text-shadow:none;">沙米色<br>#E8DBB3</div>
        <div class="swatch" style="background:#FFFDEB; color:#999; text-shadow:none; border:1px solid #ddd;">奶白<br>#FFFDEB</div>
        <div class="swatch" style="background:#CE2626;">正紅<br>#CE2626</div>
    </div>
</body>
</html>
